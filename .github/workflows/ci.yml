name: CI & Build Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Verify Next.js App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Automated Test Suite
        run: npm test
        env:
          APP_API_KEY: "ci-ephemeral-test-gateway-key"
          WEBHOOK_SECRET: "ci-ephemeral-test-webhook-secret"

      - name: Verify Next.js Build
        run: npm run build
        env:
          APP_API_KEY: "ci-ephemeral-test-gateway-key"
          WEBHOOK_SECRET: "ci-ephemeral-test-webhook-secret"
          GEMINI_API_KEY: "placeholder-ci-key"
